[project]
name = "geopulse"
version = "0.2.0"
description = "Geopolitical event-driven sector impact prediction (agentic AI)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "feedparser>=6.0",
  "praw>=7.7",
  "yfinance>=0.2.40",
  "azure-storage-queue>=12.9",
  "azure-functions>=1.19",
]

[project.optional-dependencies]
l2 = ["langgraph>=0.2", "langchain-openai>=0.2", "jinja2>=3.1"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2", "sqlalchemy>=2.0", "alembic>=1.13"]
dashboard = ["streamlit>=1.35", "plotly>=5.22"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
